services:

  # open5gs
  core:
    container_name: "core"
    image: lte-core
    command: ./initCore.sh
    tty: true
    env_file: ".env"
    build:
      dockerfile: core.Dockerfile
      context: ./docker
      network: host
    privileged: true
    network_mode: "host"
    cap_add:  
      - SYS_NICE
      - NET_ADMIN
      - SYS_ADMIN
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Running LTE Network' ./health.log"]
      interval: 5s
      timeout: 1s
      retries: 60
    volumes:
      - /dev/:/dev/
      - /proc:/proc
      - /tmp/enb:/tmp/enb
  
  # srsran gnb
  enb:
    container_name: enb
    image: lte-enb
    command: ./initEnb.sh
    env_file: ".env"
    environment:
      - TIME=$TIME
    build:
      dockerfile: enb.Dockerfile
      context: ./docker
      network: host
    privileged: true
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - SYS_ADMIN
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    volumes:
      - /gnb/:/tmp/
      - /dev/:/dev/
      - /proc:/proc
    depends_on:
      core:
        condition: service_healthy
        restart: true
    stdin_open: true
    tty: true