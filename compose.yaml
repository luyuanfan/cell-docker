services:

  # open5gs hplmn
  hplmn:
    container_name: "hplmn"
    image: cell-docker-hplmn
    command: ./initHplmn.sh
    env_file: ".env"
    environment:
      - TIME=$TIME
    build:
      dockerfile: hplmn.Dockerfile
      context: ./docker
      network: host
    privileged: true
    network_mode: "host"
    cap_add:  
      - SYS_NICE
      - NET_ADMIN
      - SYS_ADMIN
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Running 5G SA HPLMN Network' ./health.log"]
      interval: 5s
      timeout: 1s
      retries: 60
    volumes:
      - /dev/:/dev/
      - /proc:/proc
      - /hplmn:/logs
    tty: true
  
  # open5gs vplmn
  vplmn:
    container_name: "vplmn"
    image: cell-docker-vplmn
    command: ./initVplmn.sh
    env_file: ".env"
    environment:
      - TIME=$TIME
    build:
      dockerfile: vplmn.Dockerfile
      context: ./docker
      network: host
    privileged: true
    network_mode: "host"
    cap_add:  
      - SYS_NICE
      - NET_ADMIN
      - SYS_ADMIN
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Running 5G SA VPLMN Network' ./health.log"]
      interval: 5s
      timeout: 1s
      retries: 60
    volumes:
      - type: bind
        source: /open5gs/
        target: /open5gs/
        read_only: false
      - /dev/:/dev/
      - /proc:/proc
    depends_on:
      hplmn:
        condition: service_healthy
        restart: true
    tty: true
  
  # srsran gnb
  gnb:
    container_name: gnb
    image: cell-docker-gnb
    command: ./initGnb.sh
    env_file: ".env"
    environment:
      - CONTAINER_NAME="gnb"
      - TIME=$TIME
    build:
      dockerfile: gnb.Dockerfile
      context: ./docker
      network: host
    privileged: true
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - SYS_ADMIN
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    volumes:
      - type: bind
        source: /srsRAN_Project/
        target: /srsRAN_Project/
        read_only: false
      - /gnb/:/tmp/
      - /dev/:/dev/
      - /proc:/proc
    depends_on:
      vplmn:
        condition: service_healthy
        restart: true
    stdin_open: true
    tty: true